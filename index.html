<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Venta y arriendo de maquinaria y camiones con estándar minero en la zona norte de Chile: excavadoras, cargadores frontales, retroexcavadoras, grúas horquilla y camiones pluma.">
<meta property="og:type" content="website">
<meta property="og:title" content="LGC Asesorías Zona Norte · Maquinaria en venta y arriendo">
<meta property="og:description" content="Venta y arriendo de maquinaria y camiones con estándar minero en la zona norte de Chile: excavadoras, cargadores frontales, retroexcavadoras, grúas horquilla y camiones pluma.">
<meta property="og:url" content="https://www.lgcasesorias.cl/"><meta property="og:image" content="https://www.lgcasesorias.cl/fotos/7539760bc78d470ea52521d96ccfbf43.jpg">
<style>body{margin:0}img{max-width:100%}</style><title>LGC Asesorías Zona Norte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="lgc-style">
/* Layout: paleta industrial de faena — grafito (marca), Venta en amarillo de seguridad, Arriendo en azul acero y Financiamiento (opcional) en cobre. Catálogo en grilla por familia de equipo; ficha en diálogo. */
:root{
  --bg:#f3f3f1; --surface:#ffffff; --sunk:#e9e9e6; --line:#d6d6d1; --fg:#1a1d20; --muted:#5c6166; --ink:#15181b;
  --brand:#1c2126; --on-brand:#ffffff; --brand-soft:#b7bfc7;
  --venta:#e5a00d; --venta-ink:#2a1d00; --venta-soft:#fbefd0;
  --arriendo:#2b5d8c; --arriendo-ink:#ffffff; --arriendo-soft:#e0e9f3;
  --fin:#b45a2a; --fin-ink:#ffffff; --fin-soft:#f6e4d9;
  --ok:#2c7a4b; --ok-bg:#e1f1e7; --warn:#8f6400; --warn-bg:#fbefd0; --off:#6b7176; --off-bg:#e8e8e5; --danger:#b3261e;
  --sil:#3a4148;
  --shadow:0 1px 2px rgba(20,24,28,.06),0 8px 22px rgba(20,24,28,.09);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1a1d20; --sunk:#151719; --line:#2c3136; --fg:#e8e9ea; --muted:#a3a9ae; --ink:#f1f2f3;
  --brand:#0d0f11; --on-brand:#ffffff; --brand-soft:#9aa3ab;
  --venta:#f0b43c; --venta-ink:#231800; --venta-soft:#382a0c;
  --arriendo:#6fa3d6; --arriendo-ink:#0b1a29; --arriendo-soft:#18283a;
  --fin:#dd8a5a; --fin-ink:#2a1004; --fin-soft:#3a2216;
  --ok:#6fcf98; --ok-bg:#133224; --warn:#e9be5a; --warn-bg:#382a0c; --off:#a0a6ab; --off-bg:#24282c; --danger:#f2867f;
  --sil:#8d959d; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1a1d20; --sunk:#151719; --line:#2c3136; --fg:#e8e9ea; --muted:#a3a9ae; --ink:#f1f2f3;
  --brand:#0d0f11; --on-brand:#ffffff; --brand-soft:#9aa3ab;
  --venta:#f0b43c; --venta-ink:#231800; --venta-soft:#382a0c;
  --arriendo:#6fa3d6; --arriendo-ink:#0b1a29; --arriendo-soft:#18283a;
  --fin:#dd8a5a; --fin-ink:#2a1004; --fin-soft:#3a2216;
  --ok:#6fcf98; --ok-bg:#133224; --warn:#e9be5a; --warn-bg:#382a0c; --off:#a0a6ab; --off-bg:#24282c; --danger:#f2867f;
  --sil:#8d959d; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.02;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--venta);outline-offset:2px}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* barra */
.bar{background:var(--brand);color:var(--on-brand);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none}
.mark{min-width:34px;height:34px;padding:0 6px;display:grid;place-items:center;background:var(--venta);color:var(--venta-ink);font-family:var(--f-display);font-weight:800;font-size:18px;border-radius:3px}
.brand b{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-soft);margin-top:-2px}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{color:#e3efed;text-decoration:none;padding:7px 10px;font-weight:500;font-size:14px;border-bottom:2px solid transparent}
.nav a:hover{color:#fff;border-bottom-color:var(--venta)}

/* hero + líneas */
.hero{padding-block:30px 8px}
.hero h1{font-size:clamp(34px,5vw,60px);font-weight:800;color:var(--ink);text-transform:uppercase;max-width:20ch}
.hero p{color:var(--muted);max-width:62ch;margin:12px 0 0;font-size:16px}
.lines{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.2fr) minmax(0,1fr);gap:12px;margin-top:22px}
.line{display:flex;flex-direction:column;gap:6px;text-decoration:none;padding:16px 18px;border-radius:var(--r);min-height:132px;position:relative;overflow:hidden}
.line h2{font-size:30px;font-weight:800;text-transform:uppercase}
.hero .line p{margin:0;font-size:14px;color:inherit;opacity:.9;max-width:none}
.line .n{font-family:var(--f-data);font-size:13px;margin-top:auto}
.line.venta{background:var(--venta);color:var(--venta-ink)}
.line.arriendo{background:var(--arriendo);color:var(--arriendo-ink)}
.line.fin{background:var(--surface);color:var(--fg);border:1.5px dashed var(--fin)}
.line.fin h2{color:var(--fin)}
.line .tag{align-self:flex-start;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:2px;background:var(--fin-soft);color:var(--fin)}
.line:hover{filter:brightness(1.03)}

/* secciones */
.section{padding-block:30px 10px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:10px;border-bottom:3px solid var(--line)}
.sec-head h2{font-size:clamp(30px,3.6vw,42px);font-weight:800;text-transform:uppercase;color:var(--ink)}
.sec-head .kicker{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
#venta .sec-head{border-bottom-color:var(--venta)} #venta .kicker{color:var(--warn)}
#arriendo .sec-head{border-bottom-color:var(--arriendo)} #arriendo .kicker{color:var(--arriendo)}
#financiamiento .sec-head{border-bottom-color:var(--fin)} #financiamiento .kicker{color:var(--fin)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fam{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13.5px;font-weight:500}
.fam[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fam .c{font-family:var(--f-data);font-size:12px;opacity:.7;margin-left:4px}
.filters input{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 10px;min-width:0;flex:1 1 200px;max-width:320px;margin-left:auto}
.result-n{color:var(--muted);font-size:13px}

/* tarjetas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--sunk);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{width:70%;height:auto;color:var(--sil);opacity:.9}
.ph .tags{position:absolute;top:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap}
.ph .nfot{position:absolute;bottom:8px;right:8px;background:rgba(10,20,22,.72);color:#fff;font-family:var(--f-data);font-size:11px;padding:2px 7px;border-radius:2px}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:2px;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.pill.arr{background:var(--arriendo);color:var(--arriendo-ink);border-color:var(--arriendo)}
.pill.ven{background:var(--venta);color:var(--venta-ink);border-color:var(--venta)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.off{background:var(--off-bg);color:var(--off);border-color:transparent}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.cb .code{font-family:var(--f-data);font-size:11.5px;color:var(--muted)}
.cb .tipo{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.cb h3{font-size:25px;font-weight:700;color:var(--ink)}
.facts{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.1fr) minmax(0,1.35fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--surface);padding:5px 8px;min-width:0}
.facts span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.facts b{display:block;font-family:var(--f-data);font-weight:500;font-size:12px;overflow-wrap:break-word}
.price{margin-top:auto;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:6px}
.price strong{font-family:var(--f-data);font-size:19px;font-weight:500;color:var(--ink)}
.price small{font-size:12px;color:var(--muted)}
.finlink{font-size:12.5px;color:var(--fin);font-weight:600;display:flex;align-items:center;gap:6px}
.finlink::before{content:"";width:8px;height:8px;border:2px solid var(--fin);border-radius:50%}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;background:var(--surface);margin-top:16px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:center}
.empty h3{font-size:26px;text-transform:uppercase;color:var(--ink);margin-bottom:6px}
.empty p{margin:0;color:var(--muted)}
.want{display:flex;flex-wrap:wrap;gap:6px}
.want span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--arriendo-soft);color:var(--arriendo);font-weight:500}

/* diálogo ficha */
dialog{border:0;padding:0;border-radius:6px;width:min(1040px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(6,16,18,.6)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2;flex-wrap:wrap}
.dlg-head h3{font-size:28px;margin-right:auto;color:var(--ink);font-weight:700}
.x{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);width:36px;height:36px;cursor:pointer;font-size:18px;line-height:1}
.dlg-body{padding:16px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px}
.gal .main{aspect-ratio:4/3;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--sunk);display:flex;align-items:center;justify-content:center}
.gal .main img{width:100%;height:100%;object-fit:contain}
.gal .main svg{width:70%;color:var(--sil)}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.thumbs button{width:70px;height:52px;padding:0;border:1px solid var(--line);border-radius:3px;overflow:hidden;cursor:pointer;background:var(--sunk)}
.thumbs button[aria-current="true"]{outline:2px solid var(--venta);outline-offset:1px}
.thumbs img{width:100%;height:100%;object-fit:cover}
.plate{border:1.5px solid var(--ink);border-radius:3px;background:var(--surface);position:relative;padding:12px 14px 6px}
.plate::before,.plate::after{content:"";position:absolute;top:7px;width:7px;height:7px;border-radius:50%;background:var(--sunk);box-shadow:inset 0 0 0 1.5px var(--muted)}
.plate::before{left:7px}.plate::after{right:7px}
.plate-t{font-family:var(--f-display);font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);text-align:center;margin-bottom:4px;font-weight:700}
.spec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:0 12px;font-size:13.5px;margin:0}
.spec dt{color:var(--muted);padding:5px 0;border-top:1px solid var(--line)}
.spec dd{margin:0;font-family:var(--f-data);text-align:right;padding:5px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.buybox{margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--venta-soft);display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.buybox.arr{background:var(--arriendo-soft)}
.buybox strong{font-family:var(--f-data);font-size:24px;font-weight:500;color:var(--ink)}
.verif{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding:4px 10px;margin-top:12px}
.advice{background:var(--fin-soft);border-left:3px solid var(--fin);padding:10px 12px;font-size:14px;margin-top:12px;border-radius:0 var(--r) var(--r) 0}
.advice .label{color:var(--fin)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 15px;font-weight:600;cursor:pointer;font-size:14px}
.btn.wa{background:#1d7a46;border-color:#1d7a46;color:#fff;text-decoration:none;display:inline-block}
.wa-float{position:fixed;right:16px;bottom:16px;z-index:20;background:#1d7a46;color:#fff;font-weight:700;font-size:14px;padding:11px 16px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media print{.wa-float{display:none}}
.btn.venta{background:var(--venta);border-color:var(--venta);color:var(--venta-ink)}
.btn.arr{background:var(--arriendo);border-color:var(--arriendo);color:var(--arriendo-ink)}
.btn.fin{background:transparent;border-color:var(--fin);color:var(--fin)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.desc{font-size:14.5px;margin:12px 0 0;white-space:pre-line}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;margin:8px 0 0;padding:0;list-style:none;font-size:13.5px}
.checks li::before{content:"✓ ";color:var(--ok);font-weight:700}

/* financiamiento */
.finwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px}
.finpitch{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--fin);border-radius:var(--r);padding:18px}
.finpitch h3{font-size:28px;color:var(--ink);text-transform:uppercase;margin-bottom:6px}
.finpitch ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.finpitch li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:14.5px}
.finpitch li b{display:block}
.finpitch li i{width:10px;height:10px;margin-top:6px;border-radius:50%;background:var(--fin)}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 0;padding:0;list-style:none;counter-reset:f}
.flow li{font-size:13px;background:var(--sunk);padding:10px;border-radius:var(--r)}
.flow li::before{counter-increment:f;content:"Paso " counter(f);display:block;font-family:var(--f-data);font-size:11px;color:var(--fin);margin-bottom:3px}
details.cmp{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.cmp summary{cursor:pointer;padding:10px 14px;font-weight:600}
.cmp-wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;min-width:600px;font-size:13.5px}
.t th,.t td{padding:8px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.t thead th{font-family:var(--f-display);font-size:17px;letter-spacing:.03em;text-transform:uppercase}
.t tbody th{color:var(--muted);font-weight:500;width:22%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}
.flabel{font-size:12.5px;font-weight:600;color:var(--muted)}
.flabel small{font-weight:400}
.multi{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r)}
.multi summary{padding:8px 10px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
.multi summary::-webkit-details-marker{display:none}
.multi summary::after{content:"▾";color:var(--muted)}
.multi[open] summary::after{content:"▴"}
.multi-list{max-height:300px;overflow:auto;padding:2px 10px 10px;border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 var(--r) var(--r)}
.multi-list .mg{margin-top:8px}
.multi-list label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14px;cursor:pointer;font-weight:400;color:var(--fg)}
.multi-list input{margin-top:4px;accent-color:var(--venta);width:auto}
.out{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:14px}
.out div{background:var(--surface);padding:10px 12px}
.out strong{display:block;font-family:var(--f-data);font-size:18px;font-weight:500}
.out .big{grid-column:1/-1;background:var(--fin);color:var(--fin-ink)}
.out .big .label{color:var(--fin-ink);opacity:.85}
.out .big strong{font-size:30px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}

/* contacto */
.contact{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.addr{font-family:var(--f-data);font-size:16px;user-select:all;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:4px 10px;cursor:pointer;font-size:12.5px;margin-left:6px}
.msgbox{white-space:pre-wrap;font-family:var(--f-data);font-size:12.5px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-top:10px;user-select:all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:50;box-shadow:var(--shadow)}

/* gestión */
.admin{border:1px solid var(--line);border-top:4px solid var(--ink);background:var(--surface);border-radius:var(--r);padding:16px}
.adm-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.adm-table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
.adm-table th,.adm-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.adm-table th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:4px 9px;cursor:pointer;font-size:12.5px}
.ed-photos{display:flex;gap:8px;flex-wrap:wrap}
.ed-photos figure{margin:0;width:110px;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--sunk);font-size:11px}
.ed-photos img{width:100%;height:76px;object-fit:cover;display:block}
.ed-photos figcaption{display:flex;justify-content:space-between;padding:3px 4px;gap:2px}
.ed-photos figcaption button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:11px;padding:2px}
.chk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 10px;font-size:13.5px}
.chk-grid label{display:flex;gap:6px;align-items:center;font-weight:400;color:var(--fg)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);padding:8px 10px;border-radius:var(--r);font-size:13.5px;margin-bottom:10px}
footer{padding-block:26px 30px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:30px}

@media (max-width:900px){
  .lines,.dlg-body,.finwrap,.contact,.empty{grid-template-columns:minmax(0,1fr)}
  .chk-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .form,.checks,.out,.flow{grid-template-columns:minmax(0,1fr)}
  .brand small{display:none}
  .filters input{max-width:none;margin-left:0}
  .line{min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script id="lgc-app">
(() => {
"use strict";
const FAMILIAS = {

  "Movimiento de tierra": ["Rodillo compactador", "Motoniveladora", "Bulldozer"],
  "Transporte e izaje": ["Camión tolva", "Camión pluma", "Camión aljibe", "Camión", "Camioneta"],
  "Energía y otros": ["Grupo electrógeno", "Otro"]
};
const TIPOS = Object.values(FAMILIAS).flat();
const familiaDe = t => Object.keys(FAMILIAS).find(f => FAMILIAS[f].includes(t)) || "Energía y otros";
const MODALIDADES = ["Venta", "Arriendo", "Arriendo y venta"];
const ESTADOS = ["Disponible", "Reservado", "Arrendado", "Vendido"];
const CIUDADES = ["Arica", "Iquique", "Alto Hospicio", "Antofagasta", "Calama", "Mejillones", "Tocopilla", "Copiapó", "Vallenar", "Otra"];
const ESTANDAR = ["GPS", "Alarma de retroceso", "Baliza", "Pértiga", "Barra antivuelco", "Cámara de retroceso", "Extintor", "Botiquín", "Cuñas", "Kit antiderrame", "Revisión técnica vigente", "Certificación de grúa", "Mantenciones al día"];
const IVAS = ["+ IVA", "IVA incluido", "IVA por confirmar", "Tratamiento tributario por confirmar"];
const INTERESES = ["Comprar un equipo", "Arrendar un equipo", "Apoyo para financiar una compra", "Vender o publicar mi equipo", "Otro"];

let state;
try { state = JSON.parse(document.getElementById("lgc-data").textContent); } catch (e) { state = { config: {}, equipos: [] }; }
state.config = Object.assign({ correo: "contacto@lgcasesorias.cl", telefono: "", whatsapp: "", horario: "", zona: "" }, state.config || {});
state.equipos = Array.isArray(state.equipos) ? state.equipos : [];

const FIN = state.config.financiamiento !== false;   // config.financiamiento = false oculta la línea de financiamiento
const ui = { venta: { fam: "Todas", q: "" }, arriendo: { fam: "Todas", q: "" }, canEdit: false, art: null, assets: null, db: null, uid: null };
const $ = (s, r = document) => r.querySelector(s);
const waUrl = (num, txt) => { const d = String(num || "").replace(/\D/g, ""); return d ? "https://wa.me/" + d + (txt ? "?text=" + encodeURIComponent(txt) : "") : ""; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clp = n => (n == null || n === "" || isNaN(n)) ? "" : "$" + Math.round(Number(n)).toLocaleString("es-CL");
const num = n => (n == null || n === "" || isNaN(n)) ? "" : Number(n).toLocaleString("es-CL", { maximumFractionDigits: 1 });
const photoUrl = id => "fotos/" + id + ".jpg";
const enArriendo = e => e.modalidad === "Arriendo" || e.modalidad === "Arriendo y venta";
const enVenta = e => e.modalidad === "Venta" || e.modalidad === "Arriendo y venta";
const nombre = e => [e.marca, e.modelo].filter(Boolean).join(" ") || e.tipo;
const uso = e => e.horometro ? `${num(e.horometro)} h` : e.kilometraje ? `${num(e.kilometraje)} km` : "—";

function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); toast("Copiado"); }
  catch (e) { if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Selecciona el texto y cópialo con Ctrl + C"); }
}

function silhouette(tipo) {
  const wh = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="currentColor"/><circle cx="${x}" cy="${y}" r="${r * .42}" fill="var(--sunk)"/>`;
  const exc = `<rect x="40" y="70" width="88" height="16" rx="8" fill="currentColor"/><rect x="50" y="44" width="70" height="24" rx="3" fill="currentColor"/><rect x="58" y="22" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="5"/><path d="M120 50 L150 18 L176 40 L170 64" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/><path d="M160 62 l20 0 l-4 16 l-14 -2z" fill="currentColor"/>`;
  const load = `<rect x="62" y="46" width="70" height="30" rx="3" fill="currentColor"/><rect x="92" y="18" width="32" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="5"/><path d="M62 54 L34 50" stroke="currentColor" stroke-width="7"/><path d="M14 36 L38 36 L40 70 L12 70Z" fill="currentColor"/>${wh(76, 82, 15)}${wh(122, 82, 15)}`;
  const truck = `<rect x="14" y="30" width="110" height="38" rx="2" fill="currentColor"/><path d="M128 36 L158 36 L176 52 L176 70 L128 70Z" fill="currentColor"/>${wh(42, 76, 12)}${wh(70, 76, 12)}${wh(156, 76, 12)}`;
  const plant = `<path d="M20 80 L70 30 L84 30 L44 80Z" fill="currentColor"/><rect x="84" y="40" width="50" height="40" fill="currentColor"/><path d="M134 50 L186 24" stroke="currentColor" stroke-width="7"/>`;
  const f = familiaDe(tipo);
  const body = f === "Excavación" ? exc : f === "Carguío" ? load : f === "Chancado y selección" ? plant : f === "Transporte e izaje" ? truck : load;
  return `<svg viewBox="0 0 196 100" role="img" aria-label="${esc(tipo)}"><line x1="6" y1="96" x2="190" y2="96" stroke="currentColor" stroke-width="2" opacity=".35"/>${body}</svg>`;
}
const estadoPill = e => `<span class="pill ${e.estado === "Disponible" ? "ok" : e.estado === "Reservado" ? "warn" : "off"}">${esc(e.estado || "Disponible")}</span>`;

/* ---------- render ---------- */
function render() {
  const venta = state.equipos.filter(enVenta), arr = state.equipos.filter(enArriendo);
  const dv = venta.filter(e => e.estado === "Disponible").length, da = arr.filter(e => e.estado === "Disponible").length;
  const c = state.config;
  $("#app").innerHTML = `
  <header class="bar"><div class="wrap">
    <a class="brand" href="#inicio"><span class="mark">LGC</span><span><b>LGC Asesorías Zona Norte</b><small>Arriendo · Venta${FIN ? " · Financiamiento" : ""}</small></span></a>
    <nav class="nav" aria-label="Secciones"><a href="#venta">Venta</a><a href="#arriendo">Arriendo</a>${FIN ? `<a href="#financiamiento">Financiamiento</a>` : ""}<a href="#contacto">Contacto</a>${ui.canEdit ? `<a href="#gestion">Gestionar</a>` : ""}</nav>
  </div></header>
  <main id="inicio">
  <section class="wrap hero">
    <h1>Maquinaria y vehículos para faena en el norte</h1>
    <p>Asesoramos a empresas de ${esc(c.zona || "la zona norte")} en la compra y el arriendo de equipos con estándar minero.${FIN ? " Si lo necesita, también le apoyamos en la búsqueda de financiamiento." : ""}</p>
    <div class="lines"${FIN ? "" : ` style="grid-template-columns:repeat(2,minmax(0,1fr))"`}>
      <a class="line venta" href="#venta"><h2>Venta</h2><p>Equipos usados revisados, con ficha técnica, fotos y precio.</p><span class="n">${dv} equipos disponibles</span></a>
      <a class="line arriendo" href="#arriendo"><h2>Arriendo</h2><p>Arriendo mensual sin operador, mínimo 180 horas al mes.</p><span class="n">${da ? da + " equipos disponibles" : "Búsqueda a pedido"}</span></a>
      ${FIN ? `<a class="line fin" href="#financiamiento"><span class="tag">Adicional</span><h2>Financiamiento</h2><p>Le ayudamos a conseguir leasing o crédito para su compra.</p><span class="n">Leasing · crédito · opción de compra</span></a>` : ""}
    </div>
  </section>
  ${seccion("venta", "Equipos en venta", "Línea 1 · Venta", venta)}
  ${seccion("arriendo", "Equipos en arriendo", "Línea 2 · Arriendo", arr)}
  ${FIN ? financiamientoHTML() : ""}
  ${contactoHTML()}
  ${ui.canEdit ? `<section class="wrap section" id="gestion"><div id="admin"></div></section>` : ""}
  </main>
  ${c.whatsapp ? `<a class="wa-float" href="${esc(waUrl(c.whatsapp, "Hola LGC Asesorías Zona Norte, quiero consultar por equipos."))}" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">WhatsApp</a>` : ""}
  <footer><div class="wrap">LGC Asesorías · Asesoría en venta${FIN ? ", arriendo y financiamiento" : " y arriendo"} de vehículos y maquinaria · <span class="mono">${esc(c.correo)}</span>${c.whatsapp ? ` · WhatsApp <a class="mono" href="${esc(waUrl(c.whatsapp))}" target="_blank" rel="noopener">${esc(c.whatsapp)}</a>` : ""}<br>Datos técnicos, horómetros y precios informados por los propietarios de cada equipo; sujetos a inspección y confirmación.</div></footer>
  <dialog id="dlg" aria-labelledby="dlg-t"></dialog>`;
  bind();
  renderGrid("venta"); renderGrid("arriendo");
  if (ui.canEdit) renderAdmin();
}
function seccion(key, titulo, kicker, lista) {
  const fams = Object.keys(FAMILIAS).filter(f => lista.some(e => familiaDe(e.tipo) === f));
  return `<section class="wrap section" id="${key}">
    <div class="sec-head"><div><span class="kicker">${kicker}</span><h2>${titulo}</h2></div><span class="label">${key === "venta" ? "Precios en pesos chilenos" : "Valores netos en pesos chilenos"}</span></div>
    ${lista.length ? `<div class="filters" role="group" aria-label="Familia de equipo">
      ${["Todas", ...fams].map(f => `<button type="button" class="fam" data-sec="${key}" data-fam="${esc(f)}" aria-pressed="${ui[key].fam === f}">${esc(f)}<span class="c">${f === "Todas" ? lista.length : lista.filter(e => familiaDe(e.tipo) === f).length}</span></button>`).join("")}
      <input type="search" id="q-${key}" placeholder="Buscar marca, modelo o código" value="${esc(ui[key].q)}" aria-label="Buscar en ${titulo.toLowerCase()}">
    </div><div class="grid" id="grid-${key}"></div>` : (key === "arriendo" ? `<div class="empty">
      <div><h3>Le buscamos el equipo en arriendo</h3><p>Estamos sumando equipos propios y de socios a esta sección. Cuéntenos qué necesita, para qué faena y por cuánto tiempo, y le enviamos alternativas con estándar minero.</p>
      <div class="actions"><button class="btn arr" type="button" data-pedir="Arrendar un equipo">Solicitar un equipo en arriendo</button></div></div>
      <div class="want">${["Retroexcavadora", "Excavadora", "Cargador frontal", "Rodillo compactador", "Grúa horquilla", "Camión pluma", "Camión tolva", "Camioneta 4x4"].map(x => `<span>${x}</span>`).join("")}</div>
    </div>` : `<div class="empty"><div><h3>Sin equipos publicados</h3><p>Escríbanos y le ayudamos a encontrar lo que busca.</p></div></div>`)}
  </section>`;
}
function renderGrid(key) {
  const g = $("#grid-" + key); if (!g) return;
  const f = ui[key], q = f.q.trim().toLowerCase();
  const base = state.equipos.filter(key === "venta" ? enVenta : enArriendo);
  const orden = { Disponible: 0, Reservado: 1, Arrendado: 2, Vendido: 3 };
  const l = base.filter(e => (f.fam === "Todas" || familiaDe(e.tipo) === f.fam) && (!q || [e.tipo, e.marca, e.modelo, e.codigo, e.ubicacion].join(" ").toLowerCase().includes(q)))
    .sort((a, b) => (orden[a.estado] ?? 0) - (orden[b.estado] ?? 0));
  if (!l.length) { g.innerHTML = `<p class="note" style="grid-column:1/-1">Ningún equipo coincide con la búsqueda.</p>`; return; }
  g.innerHTML = l.map(e => {
    const fotos = e.fotos || [];
    const precio = key === "venta" ? (e.ventaValor ? `<strong>${clp(e.ventaValor)}</strong><small>${esc(e.iva || "+ IVA")}</small>` : `<strong>A cotizar</strong>`)
      : (e.arriendoValor ? `<strong>${clp(e.arriendoValor)}</strong><small>/ ${esc(e.arriendoUnidad || "mes")} + IVA</small>` : `<strong>A cotizar</strong>`);
    return `<button type="button" class="card" data-open="${esc(e.id)}" data-mode="${key}" aria-label="Ver ficha de ${esc(e.tipo + " " + nombre(e))}">
      <div class="ph">${fotos.length ? `<img src="${photoUrl(fotos[0])}" alt="" loading="lazy" data-tipo="${esc(e.tipo)}">` : silhouette(e.tipo)}
        <div class="tags">${key === "venta" ? `<span class="pill ven">Venta</span>` : `<span class="pill arr">Arriendo</span>`}${e.modalidad === "Arriendo y venta" ? `<span class="pill">${key === "venta" ? "También en arriendo" : "También en venta"}</span>` : ""}</div>
        ${fotos.length > 1 ? `<span class="nfot">${fotos.length} fotos</span>` : ""}</div>
      <div class="cb">
        <div class="top"><span class="tipo">${esc(e.tipo)}</span>${estadoPill(e)}</div>
        <h3>${esc(nombre(e))}</h3>
        <div class="facts"><div><span>Año</span><b>${esc(e.anio || "—")}</b></div><div><span>Uso</span><b>${uso(e)}</b></div><div><span>Ciudad</span><b>${esc(e.ubicacion || "—")}</b></div></div>
        <div class="price">${precio}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="code">${esc(e.codigo || "")}</span>${key === "venta" && FIN ? `<span class="finlink">Financiable</span>` : ""}</div>
      </div></button>`;
  }).join("");
  g.querySelectorAll("img[data-tipo]").forEach(img => img.addEventListener("error", () => { const w = document.createElement("span"); w.innerHTML = silhouette(img.dataset.tipo); img.replaceWith(w.firstChild); }, { once: true }));
}
function bind() {
  document.querySelectorAll("[data-fam]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.sec; ui[k].fam = b.dataset.fam;
    document.querySelectorAll(`[data-sec="${k}"]`).forEach(x => x.setAttribute("aria-pressed", x === b)); renderGrid(k);
  }));
  ["venta", "arriendo"].forEach(k => { const i = $("#q-" + k); if (i) i.addEventListener("input", () => { ui[k].q = i.value; renderGrid(k); }); const g = $("#grid-" + k); if (g) g.addEventListener("click", ev => { const c = ev.target.closest("[data-open]"); if (c) openFicha(c.dataset.open, c.dataset.mode); }); });
  document.querySelectorAll("[data-pedir]").forEach(b => b.addEventListener("click", () => irContacto(b.dataset.pedir, "")));
  if ($("#f-cotizar")) $("#f-cotizar").addEventListener("click", () => irContacto("Apoyo para financiar una compra", ""));
  $("#c-form").addEventListener("submit", ev => ev.preventDefault());
  if ($("#c-enviar-wa")) $("#c-enviar-wa").addEventListener("click", ev => prepararEnvio(ev, "wa"));
  $("#c-enviar-mail").addEventListener("click", ev => prepararEnvio(ev, "mail"));
  document.querySelectorAll('input[name="c-eq"]').forEach(x => x.addEventListener("change", resumenEquipos));
  $("#c-copy-mail").addEventListener("click", () => copyText(state.config.correo, $("#c-mail")));
  $("#dlg").addEventListener("click", ev => { if (ev.target === ev.currentTarget) ev.currentTarget.close(); });
}
function irContacto(interes, equipo, mensaje) {
  $("#c-interes").value = interes; if (equipo) marcarEquipo(equipo); if (mensaje) $("#c-mensaje").value = mensaje;
  $("#contacto").scrollIntoView({ behavior: "smooth" }); setTimeout(() => $("#c-nombre").focus({ preventScroll: true }), 450);
}

/* ---------- ficha ---------- */
function openFicha(id, mode) {
  const e = state.equipos.find(x => x.id === id); if (!e) return;
  const d = $("#dlg"), fotos = e.fotos || [];
  const spec = [["Código", e.codigo], ["Tipo", e.tipo], ["Marca / modelo", nombre(e)], ["Año", e.anio], ["Horómetro", e.horometro ? num(e.horometro) + " h" : ""], ["Kilometraje", e.kilometraje ? num(e.kilometraje) + " km" : ""],
    ["Patente", e.patente], ["N.º de serie", e.serie], ["Potencia / motor", e.potencia], ["Peso operativo", e.peso], ["Capacidad", e.capacidad], ["Combustible", e.combustible], ["Tracción / rodado", e.traccion], ["Operador", e.operador],
    ...(e.extras || []), ["Ubicación", e.ubicacion], ["Estado", e.estado]].filter(r => r[1] !== undefined && r[1] !== null && r[1] !== "");
  const venta = mode !== "arriendo" && enVenta(e);
  const ref = `${e.codigo || ""} · ${e.tipo} ${nombre(e)}`.trim();
  d.innerHTML = `
    <div class="dlg-head"><h3 id="dlg-t">${esc(e.tipo)} ${esc(nombre(e))}</h3>${enVenta(e) ? `<span class="pill ven">Venta</span>` : ""}${enArriendo(e) ? `<span class="pill arr">Arriendo</span>` : ""}<button class="x" type="button" data-close aria-label="Cerrar">×</button></div>
    <div class="dlg-body">

/* Selector desplegable con todos los equipos disponibles; se pueden marcar varios */
const disponible = e => e.estado === "Disponible" || e.estado === "Reservado";
const refEquipo = e => `${e.codigo} · ${e.tipo} ${nombre(e)}`;
function selectorEquipos() {
  const disp = state.equipos.filter(disponible);
  const grupo = (t, l) => l.length ? `<div class="mg"><span class="label">${t}</span>${l.map(e => `<label><input type="checkbox" name="c-eq" value="${esc(refEquipo(e))}" data-cod="${esc(e.codigo)}"><span><span class="mono">${esc(e.codigo)}</span> · ${esc(e.tipo)} ${esc(nombre(e))}</span></label>`).join("")}</div>` : "";
  return `<details class="multi" id="c-equipos"><summary id="c-equipos-s">Seleccione uno o más equipos</summary>
    <div class="multi-list" role="group" aria-labelledby="c-equipos-l">
      ${grupo("Venta", disp.filter(enVenta))}${grupo("Arriendo", disp.filter(e => enArriendo(e) && !enVenta(e)))}
      <div class="mg"><label><input type="checkbox" name="c-eq" value="Otro equipo (detallado abajo)"><span>Otro equipo (indíquelo en el detalle)</span></label></div>
    </div></details>`;
}
function resumenEquipos() {
  const n = document.querySelectorAll('input[name="c-eq"]:checked').length;
  $("#c-equipos-s").textContent = n === 0 ? "Seleccione uno o más equipos" : n === 1 ? "1 equipo seleccionado" : n + " equipos seleccionados";
}
function marcarEquipo(ref) {
  const m = /LGC-EQ-\d+/.exec(ref || ""); if (!m) return;
  const cb = document.querySelector(`input[name="c-eq"][data-cod="${m[0]}"]`); if (cb) cb.checked = true;
  resumenEquipos();
}
function leerConsulta() {
  return { nombre: $("#c-nombre").value.trim(), empresa: $("#c-empresa").value.trim(), correo: $("#c-correo").value.trim(), fono: $("#c-fono").value.trim(),
    interes: $("#c-interes").value, ciudad: $("#c-ciudad").value.trim(), mensaje: $("#c-mensaje").value.trim(),
    equipos: [...document.querySelectorAll('input[name="c-eq"]:checked')].map(x => x.value) };
}
function textoConsulta(v) {
  const eq = v.equipos.length === 0 ? "." : v.equipos.length === 1 ? ": " + v.equipos[0] + "." : ":\n" + v.equipos.map(x => "- " + x).join("\n");
  const firma = [v.nombre + (v.empresa ? " · " + v.empresa : ""), [v.correo, v.fono].filter(Boolean).join(" · ")].filter(Boolean).join("\n");
  return `Hola LGC Asesorías,\n\n${v.interes}${eq}\n${v.ciudad ? "Ciudad de la faena: " + v.ciudad + "\n" : ""}${v.mensaje ? "\n" + v.mensaje + "\n" : ""}\n${firma}`;
}
/* Al presionar el botón se arma el mensaje y se abre WhatsApp o el correo con todo escrito */
function prepararEnvio(ev, canal) {
  const v = leerConsulta(), st = $("#c-status"), a = ev.currentTarget;
  if (!v.nombre) { ev.preventDefault(); st.textContent = "Indique su nombre para enviar la solicitud."; $("#c-nombre").focus(); return; }
  st.textContent = "";
  const txt = textoConsulta(v), c = state.config;
  a.href = canal === "wa" ? waUrl(c.whatsapp, txt)
    : "mailto:" + c.correo + "?subject=" + encodeURIComponent("Solicitud de cotización · " + v.interes) + "&body=" + encodeURIComponent(txt);
}

      ${ui.assets ? `<input id="ed-file" type="file" accept="image/jpeg,image/png,image/webp" multiple>` : `<p class="note" style="margin:0">La carga de fotos no está disponible en esta vista.</p>`}
      <div class="ed-photos" id="ed-photos" style="margin-top:8px"></div><span class="note" id="ed-up" style="margin:0"></span></div>
    <div class="full" style="display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px"><button class="btn venta" type="submit">Guardar y publicar</button><button class="btn" type="button" data-close style="background:transparent;color:var(--fg);border-color:var(--line)">Cancelar</button></div>
  </form>`;
  d.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => d.close()));
  drawPhotos();
  const f = $("#ed-file");
  if (f) f.addEventListener("change", async () => {
    const files = [...f.files]; f.value = "";
    for (const file of files) {
      $("#ed-up").textContent = `Subiendo ${file.name}…`;
      try { if (file.size > 20 * 1024 * 1024) throw { code: "too_large" }; const r = await ui.assets.upload(file); editing.fotos.push(r.id); drawPhotos(); $("#ed-up").textContent = ""; }
      catch (er) { $("#ed-up").textContent = er && er.code === "too_large" ? `${file.name} pesa más de 20 MB; redúcela e inténtalo de nuevo.` : er && er.code === "unsupported_type" ? `${file.name}: usa JPG, PNG o WEBP.` : `No se pudo subir ${file.name}.`; }
    }
  });
  $("#ed-form").addEventListener("submit", ev => {
    ev.preventDefault();
    const g = k => $("#ed-" + k).value.trim(), n = k => { const v = g(k); return v === "" ? null : Number(v); };
    const extras = g("extras").split("\n").map(l => l.trim()).filter(Boolean).map(l => { const i = l.indexOf(":"); return i > 0 ? [l.slice(0, i).trim(), l.slice(i + 1).trim()] : ["Detalle", l]; });
    Object.assign(editing, { codigo: g("codigo") || nextCodigo(), tipo: g("tipo"), marca: g("marca"), modelo: g("modelo"), anio: n("anio"), modalidad: g("modalidad"), estado: g("estado"), ubicacion: g("ubicacion"),
      horometro: n("horometro"), kilometraje: n("kilometraje"), patente: g("patente"), serie: g("serie"), potencia: g("potencia"), peso: g("peso"), capacidad: g("capacidad"), combustible: g("combustible"), traccion: g("traccion"), operador: g("operador"),
      iva: g("iva"), ventaValor: n("ventaValor"), arriendoValor: n("arriendoValor"), arriendoUnidad: g("arriendoUnidad"), extras, descripcion: g("descripcion"), verificacion: g("verificacion"), asesoria: g("asesoria"),
      estandar: ESTANDAR.filter((s, i) => $("#ed-std-" + i).checked) });
    if (!editing.marca && !editing.modelo) { $("#ed-up").textContent = "Indica al menos la marca o el modelo."; return; }
    const i = state.equipos.findIndex(x => x.id === editing.id);
    if (i >= 0) state.equipos[i] = editing; else state.equipos.unshift(editing);
    d.close(); publicar(base ? "Equipo actualizado" : "Equipo agregado");
  });
  d.showModal();
}
function drawPhotos() {
  const box = $("#ed-photos"); if (!box) return;
  box.innerHTML = editing.fotos.map((f, i) => `<figure><img src="${photoUrl(f)}" alt="Foto ${i + 1}"><figcaption>${i ? `<button type="button" data-first="${i}">Portada</button>` : "<span>Portada</span>"}<button type="button" data-rm="${i}">Quitar</button></figcaption></figure>`).join("");
  box.querySelectorAll("[data-first]").forEach(b => b.addEventListener("click", () => { const [x] = editing.fotos.splice(+b.dataset.first, 1); editing.fotos.unshift(x); drawPhotos(); }));
  box.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => { editing.fotos.splice(+b.dataset.rm, 1); drawPhotos(); }));
}

/* ---------- publicar ---------- */
const SKELETON_HEAD = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
function buildDocument() {
  const json = JSON.stringify({ config: state.config, equipos: state.equipos }).replace(/</g, "\\u003c");
  const fonts = document.querySelector('link[rel="stylesheet"][href*="fonts.googleapis"]');
  return SKELETON_HEAD + '<title>LGC Asesorías Zona Norte</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
    '<link rel="stylesheet" href="' + (fonts ? fonts.getAttribute("href") : "") + '">\n' +
    '<style id="lgc-style">' + document.getElementById("lgc-style").textContent + '</style>\n<div id="app"></div>\n' +
    '<script type="application/json" id="lgc-data">' + json + '<\/script>\n<script id="lgc-app">' + document.getElementById("lgc-app").textContent + '<\/script></body></html>';
}
async function publicar(msg) {
  if (!ui.art) { toast("No se puede guardar en esta vista."); return; }
  try { sessionStorage.setItem("lgc-msg", msg); } catch (e) {}
  toast("Publicando…");
  try { await ui.art.publish(buildDocument()); }
  catch (er) {
    try { sessionStorage.removeItem("lgc-msg"); } catch (e) {}
    const c = er && er.code;
    if (c === "conflict") toast("Otra persona guardó cambios; se cargará la versión más reciente.");
    else if (["not_writer", "not_granted", "capability_disabled", "consent_required", "not_declared"].includes(c)) { ui.canEdit = false; toast("Esta vista es de solo lectura."); render(); }
    else if (c === "too_large") toast("El catálogo es demasiado grande para guardarlo.");
    else if (c === "rate_limited") toast("Muchos guardados seguidos; espera un momento.");
    else toast("No se pudo publicar. Inténtalo de nuevo en unos segundos.");
  }
}

render();
/* Enlace directo a una ficha: ...#LGC-EQ-001 (usado en el catálogo de WhatsApp) */
function abrirDesdeHash() {
  const h = decodeURIComponent(location.hash.slice(1)).toUpperCase(); if (!/^LGC-EQ-\d+$/.test(h)) return;
  const e = state.equipos.find(x => (x.codigo || "").toUpperCase() === h);
  if (e) setTimeout(() => openFicha(e.id, enVenta(e) ? "venta" : "arriendo"), 200);
}
abrirDesdeHash(); addEventListener("hashchange", abrirDesdeHash);
try { const m = sessionStorage.getItem("lgc-msg"); if (m) { sessionStorage.removeItem("lgc-msg"); setTimeout(() => toast(m + " y publicado"), 300); } } catch (e) {}
(async () => {
  const cl = window.claude; if (!cl || !cl.use) return;
  const [user, art, assets, db] = await Promise.all(["user", "artifact", "assets", "db"].map(n => cl.use(n).catch(() => null)));
  ui.art = art; ui.assets = assets; ui.db = db;
  try { ui.uid = user ? await user.id() : null; } catch (e) { ui.uid = null; }
  let canEdit = false; try { canEdit = !!(user && await user.canEdit()); } catch (e) {}
  if (canEdit && art) { ui.canEdit = true; render(); }
})();
})();
</script>

</html>
